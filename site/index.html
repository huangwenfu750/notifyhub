<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 首屏绘制前定好主题，避免闪一下深色/浅色。逻辑与 src/theme.js 保持一致。
      (function () {
        try {
          var m = localStorage.getItem('notifyhub-site-theme') || 'system';
          var dark =
            m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotifyHub · 多语言通知推送服务</title>
    <meta
      name="description"
      content="NotifyHub：单进程部署的多语言通知推送服务。任意语言客户端通过 gRPC 接入，把通知推送到钉钉 / 企业微信 / 飞书 / 任意 Webhook，并支持基于主题通配符的事件订阅。"
    />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="NotifyHub · 多语言通知推送服务" />
    <meta
      property="og:description"
      content="单进程 gRPC 服务，把通知推到钉钉 / 企业微信 / 飞书 / 任意 Webhook，支持主题通配符订阅、限流重试去重。"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
