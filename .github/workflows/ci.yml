name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # TS SDK 用 @grpc/proto-loader 加载自己那份副本，不同步会静默用旧契约
      - name: 校验 proto 副本与主契约一致
        run: diff proto/notify/v1/notify.proto sdks/typescript/proto/notify/v1/notify.proto

      # 版本号散在 9 处，漏改一处就会出现「包是新版、服务端报旧版」
      - name: 校验版本号一致
        run: python scripts/check-versions.py

      - name: 生成 Java stub
        run: bash scripts/gen-protos.sh java

      - name: 生成 Python stub
        run: bash scripts/gen-protos.sh python

      - name: 生成 Go stub 并编译
        run: |
          bash scripts/gen-protos.sh go
          cd sdks/go && go mod tidy && go build ./...
          cd ../../smoke/go && go build ./...

      - name: Gradle 单元测试
        run: gradle test

      - name: 构建服务端发行版
        run: gradle :server:installDist

      - name: 安装 Python SDK
        run: python -m pip install -e sdks/python

      - name: 构建 TypeScript SDK
        run: cd sdks/typescript && npm install && npm run build

      - name: 跨语言烟雾测试（Java / Python / Node / Go）
        run: |
          ./server/build/install/server/bin/server --config smoke/config.yaml &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 5
          python smoke/py_smoke.py
          node smoke/node_smoke.js
          gradle :sdk-java:smoke -Ptoken=ntf_smoke_token
          cd smoke/go && go run .
