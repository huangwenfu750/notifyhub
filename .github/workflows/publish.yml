name: Publish

# 发布各语言 SDK 到包管理平台，在 Release 发布后触发（也可手动跑）。
#
# npm / pnpm / yarn / bun 共用同一个 npm registry，下面这个 npm 任务发布一次即可让四者都能安装。
#
# 需要的仓库 Secrets（缺哪个就跳过哪个任务，不会让发布失败）：
#   NPM_TOKEN           npmjs.com 的 Automations/Access Token
#   PYPI_API_TOKEN      PyPI 的 API token（以 pypi- 开头）
#   MAVEN_URL / MAVEN_USER / MAVEN_PASSWORD
#                       其它 Maven 仓库（如 Maven Central 的 OSSRH staging 地址）
#   MAVEN_SIGNING_KEY   GPG 私钥（Maven Central 强制要求）
#   CENTRAL_USERNAME / CENTRAL_PASSWORD
#                       Central Portal 的 User Token，用于自动上传 bundle（不配就只留构建产物）
# GitHub Packages 用内置的 GITHUB_TOKEN，无需额外配置。

# 注意：不能用 `release: published` —— Release 是用 GITHUB_TOKEN 建的，
# 由 GITHUB_TOKEN 触发的事件不会级联触发其它工作流。改为监听 Release 工作流跑完。
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  npm:
    name: npm (npmjs.com)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 构建
        run: cd sdks/typescript && npm install && npm run build
      - name: 发布
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::未配置 NPM_TOKEN，跳过 npm 发布"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          cd sdks/typescript
          # npm 不允许覆盖已发布的版本号，重跑同一个版本必然 403。
          # 这属于「已经发过了」，按成功处理，否则每次重跑工作流都是一片红。
          set +e
          OUT="$(npm publish --access public 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUT" | grep -q "previously published"; then
            echo "::warning::该版本在 npm 上已存在，跳过（npm 不允许覆盖同名版本）"
            exit 0
          fi
          # 剩下的 403 基本都是 token 权限不够，直说原因比让人去翻 npm 的长日志强
          echo "::error::npm publish 失败。若日志里有 403 'You may not perform that action'，说明 NPM_TOKEN 没有发布权限：换成 npmjs.com 的 Classic / Automation token，或给 granular token 勾上 Read and write（且不要限定到别的包）"
          exit 1

  pypi:
    name: PyPI
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          cd sdks/python && python -m build
      - name: 上传
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::未配置 PYPI_API_TOKEN，跳过 PyPI 发布"
            exit 0
          fi
          twine upload --skip-existing sdks/python/dist/*

  maven-github:
    name: Maven (GitHub Packages)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: 生成 Java stub
        run: bash scripts/gen-protos.sh java
      - name: 发布到 GitHub Packages
        env:
          MAVEN_URL: https://maven.pkg.github.com/huangwenfu750/notifyhub
          MAVEN_USER: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 该 registry 不允许覆盖已发布的版本，重跑会 409；先探测，已存在就跳过，避免无谓红灯
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' protos/build.gradle.kts)
          for a in protos sdk-java notifyhub-spring-boot-starter; do
            url="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/io/github/huangwenfu750/${a}/${VER}/${a}-${VER}.pom"
            code=$(curl -sL -o /dev/null -w '%{http_code}' -u "${MAVEN_USER}:${MAVEN_PASSWORD}" "$url")
            echo "${a} ${VER} -> ${code}"
            if [ "$code" = "200" ]; then
              echo "::warning::${a} ${VER} 已在 GitHub Packages 上，跳过发布（要重发请先 bump 版本）"
              exit 0
            fi
          done
          gradle publishNotifyHub

  maven-remote:
    name: Maven (其它远端仓库)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: 生成 Java stub
        run: bash scripts/gen-protos.sh java
      - name: 发布
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAVEN_URL" ]; then
            echo "::warning::未配置 MAVEN_URL，跳过远端 Maven 发布"
            exit 0
          fi
          gradle publishNotifyHub

  maven-central-bundle:
    name: Maven Central 上传包
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: 生成 Java stub
        run: bash scripts/gen-protos.sh java
      # Portal 要求一次上传完整 deployment，所以先发到本地目录再整体打 zip
      - name: 构建 bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAVEN_SIGNING_KEY" ]; then
            echo "::warning::未配置 MAVEN_SIGNING_KEY，打出的 bundle 无签名，Central 会拒收 —— 只用于检查产物"
          fi
          gradle publishNotifyHubToCentralBundle
      - uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: build/central/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: 列出 bundle 内容
        run: |
          ZIP="$(ls build/central/*.zip)"
          echo "bundle: $ZIP"
          unzip -l "$ZIP" | sed -n '1,8p;$p'
          echo "--- .asc 文件数 ---"
          unzip -l "$ZIP" | grep -c '\.asc$' || true

      # 配了 Portal User Token 就上传 + 自动发布；没配就只留 artifact 供手动下载。
      # USER_MANAGED 下上传完只是 VALIDATED，必须再 POST /deployment/<id> 才真正对外可见
      # —— 少了这一步，repo1.maven.org 上会一直是 404，很容易误以为发布成功了。
      - name: 上传并发布到 Central Portal（可选）
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "$CENTRAL_USERNAME" ]; then
            echo "::warning::未配置 CENTRAL_USERNAME / CENTRAL_PASSWORD（Portal User Token），跳过上传"
            exit 0
          fi
          # Central 不允许覆盖已发布的版本号，重跑同一个版本必然失败。
          # 先探一下仓库里有没有，有了就当「已发布」跳过，和 npm / PyPI 的处理保持一致。
          VER="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' protos/build.gradle.kts | head -1)"
          CHK="https://repo1.maven.org/maven2/io/github/huangwenfu750/protos/$VER/"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$CHK")" = "200" ]; then
            echo "::warning::$VER 已在 Maven Central（$CHK），跳过上传 —— 发新版本前先 bump 版本号"
            exit 0
          fi
          echo "版本号 $VER，Central 上尚未发布，继续上传"
          # 三个坑：
          # 1) 路径是 /api/v1/publisher/upload，不是 v3 —— v3 不存在，POST 过去一律 500 且无响应体
          # 2) 认证是 Authorization: Bearer <base64(用户名:口令)>，不是 HTTP Basic（curl -u）
          # 3) /status 是 POST 不是 GET —— 用 GET 会拿到 401 Invalid token，看着像 token 失效
          # 不用 curl -f：它会把 4xx/5xx 的响应体一起吞掉，出错时完全看不出原因
          API="https://central.sonatype.com/api/v1/publisher"
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w 0)"
          RESP="$(mktemp)"

          CODE="$(curl -sS -o "$RESP" -w '%{http_code}' \
            -H "Authorization: Bearer $AUTH" \
            -F "bundle=@$(ls build/central/*.zip)" \
            "$API/upload?publishingType=USER_MANAGED")"
          echo "HTTP $CODE"
          cat "$RESP"; echo
          if [ "$CODE" != 201 ]; then
            echo "::error::上传失败（HTTP $CODE）。201 才是成功；401 = User Token 无效或已轮换；400 = bundle 校验不通过"
            exit 1
          fi
          DEP="$(tr -d ' \t\r\n' < "$RESP")"
          echo "deploymentId=$DEP"

          state() {
            curl -sS -X POST -H "Authorization: Bearer $AUTH" "$API/status?id=$DEP" \
              | grep -o '"deploymentState":"[A-Z_]*"' | head -1 | cut -d'"' -f4
          }
          dump() {
            echo "--- status 详情 ---"
            curl -sS -X POST -H "Authorization: Bearer $AUTH" "$API/status?id=$DEP"
            echo
          }

          # 阶段一：等校验（PENDING -> VALIDATING -> VALIDATED / FAILED）
          # 校验一般 1~3 分钟，给 13 分钟余量
          for i in $(seq 1 40); do
            S="$(state)"; echo "[$i/40] $S"
            case "$S" in
              VALIDATED) break ;;
              FAILED)
                dump
                echo "::error::bundle 校验失败。常见原因：缺 .asc 签名 / sources / javadoc，或 POM 元数据不全"
                exit 1 ;;
            esac
            sleep 15
          done
          if [ "$S" != "VALIDATED" ]; then
            echo "::error::等了 10 分钟仍是 '$S'，放弃。到 Portal → Deployments 看 $DEP"
            exit 1
          fi

          # 阶段二：显式发布（USER_MANAGED 的必经一步）
          PCODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $AUTH" "$API/deployment/$DEP")"
          echo "publish HTTP $PCODE（204 = 已触发发布）"
          if [ "$PCODE" != 204 ]; then
            echo "::error::发布失败（HTTP $PCODE）。VALIDATED 状态下应为 204"
            exit 1
          fi

          # 阶段三：等落地（PUBLISHING -> PUBLISHED / FAILED）
          # PUBLISHING 是正常中间态：Central 要把产物推到 repo1 并等 CDN 生效，
          # 实测 15~30 分钟都算正常，这里给 40 分钟。10 分钟就放弃会误报失败。
          for i in $(seq 1 80); do
            S="$(state)"; echo "[$i/80] $S"
            case "$S" in
              PUBLISHED) break ;;
              FAILED)
                dump
                echo "::error::发布到 Maven Central 失败"
                exit 1 ;;
            esac
            sleep 30
          done
          if [ "$S" != "PUBLISHED" ]; then
            echo "::error::等了 40 分钟仍未 PUBLISHED（当前 '$S'）"
            exit 1
          fi
          echo "已发布到 Maven Central"
