name: Release

# 打 v* 标签即触发：构建 Linux 发行包并创建 GitHub Release 附上产物，
# 同时自动打 Go 模块标签 sdks/go/v*（Go 模块必须带子目录前缀的独立标签）。
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建服务端发行版
        run: gradle :server:installDist

      - name: 打包（自带 JRE / 精简版）
        run: |
          ./scripts/package-linux.sh
          ./scripts/package-linux.sh --no-jre

      - name: 列出产物
        run: ls -lh build/linux/notifyhub-*.tar.gz build/linux/notifyhub-*.sha256

      # 用 CHANGELOG.md 里该版本的段落作为发布说明（比自动生成的提交列表好读）
      - name: 提取本版本更新日志
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - "${TAG#v}" > release-notes.md <<'PY'
          import re, sys

          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[?' + re.escape(ver) + r'\]?[^\n]*\n(.*?)(?=^## |\Z)',
                        text, re.S | re.M)
          print(m.group(1).strip() if m
                else f'（CHANGELOG.md 里没有 {ver} 的条目，发版前请先补上）')
          PY
          cat release-notes.md

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # 重跑这个工作流时别因为 Release 已存在而失败（Go 模块标签 job 可能才需要补跑）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG 已存在，跳过创建（要重发请先 gh release delete $TAG）"
            exit 0
          fi
          # 只传 notifyhub-* ：build/linux/ 下还有打包时下载的 jre21.tar.gz，别一并传上去
          gh release create "$TAG" \
            --title "NotifyHub $TAG" \
            --notes-file release-notes.md \
            build/linux/notifyhub-*.tar.gz \
            build/linux/notifyhub-*.sha256

  # Go 子模块必须用自己的标签（sdks/go/v*）才能被 go get 发现。
  # 这个标签以前是手工打的，漏打一次就出现了 v0.1.0 缺 gen/ 的事故，所以收进 CI。
  go-tag:
    name: Go 模块标签（sdks/go/v*）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 解析标签名
        id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "gotag=sdks/go/$TAG" >> "$GITHUB_OUTPUT"

      # Go 模块是从仓库按标签直接取源码的：gen/ 只要漏入库，用户 go get 到的就是编译不过的包。
      # v0.1.0 正是这么坏的（.gitignore 里写了 sdks/go/gen/），这里双重设卡防复发。
      - name: 校验 stub 已入库且能编译
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 不重新 fetch：checkout 已经把触发用的标签取下来了，
          # 再 fetch 到同名 ref 会被拒（would clobber existing tag）。
          missing=0
          for f in sdks/go/gen/notify/v1/notify.pb.go sdks/go/gen/notify/v1/notify_grpc.pb.go; do
            if [ ! -f "$f" ]; then
              echo "::error::$f 不存在"
              missing=1
            elif ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 没被 git 跟踪，go get 拿不到（多半是 .gitignore 又把它排除了）"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          cd sdks/go && go build ./...

      # 本机 git 创建带斜杠的 ref 会静默失败（git tag sdks/go/vX 返回 0 但不写入），所以走 API。
      - name: 创建 / 更新 sdks/go 标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          GOTAG: ${{ steps.v.outputs.gotag }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          echo "$GOTAG -> $SHA"
          # 用 ls-remote 判存在：gh api 拼带斜杠的 ref 路径容易踩坑
          if git ls-remote --exit-code --tags origin "refs/tags/$GOTAG" >/dev/null 2>&1; then
            echo "$GOTAG 已存在，强制更新"
            curl -fsS -X PATCH "${AUTH[@]}" "$API/git/refs/tags/$GOTAG?force=true" \
              -d "{\"sha\":\"$SHA\",\"force\":true}" >/dev/null
          else
            curl -fsS -X POST "${AUTH[@]}" "$API/git/refs" \
              -d "{\"ref\":\"refs/tags/$GOTAG\",\"sha\":\"$SHA\"}" >/dev/null
            echo "已创建 $GOTAG"
          fi

      # 代理第一次被问到才会去抓标签，抓完就按版本号永久缓存 —— 所以要在 CI 里先问一次，
      # 顺便把「缓存的 zip 里到底有没有 stub」验掉，别等用户 go get 才发现。
      - name: 预热并校验模块代理缓存
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://proxy.golang.org/github.com/huangwenfu750/notifyhub/sdks/go/@v"
          for i in $(seq 1 12); do
            if curl -fsS "$BASE/$TAG.info" >/dev/null; then break; fi
            echo "第 $i 次未就绪，10s 后重试"
            sleep 10
          done
          curl -fsSL -o /tmp/mod.zip "$BASE/$TAG.zip"
          python3 - <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile('/tmp/mod.zip').namelist()
          stubs = [n for n in names if n.endswith('notify.pb.go')]
          print('zip 内文件数:', len(names))
          print('stub:', stubs)
          if not stubs:
              sys.exit('!! 代理缓存的模块里没有 stub，go get 仍会失败')
          PY
