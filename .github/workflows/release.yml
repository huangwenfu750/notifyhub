name: Release

# 打 v* 标签即触发：构建 Linux 发行包并创建 GitHub Release 附上产物。
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建服务端发行版
        run: gradle :server:installDist

      - name: 打包（自带 JRE / 精简版）
        run: |
          ./scripts/package-linux.sh
          ./scripts/package-linux.sh --no-jre

      - name: 列出产物
        run: ls -lh build/linux/*.tar.gz build/linux/*.sha256

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "NotifyHub $TAG" \
            --generate-notes \
            build/linux/*.tar.gz \
            build/linux/*.sha256
