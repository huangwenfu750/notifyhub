org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Spring Boot starter 编译时依赖版本（运行期由使用方项目的 Spring Boot 版本决定）
springBootVersion=3.5.16

# 发布到 Maven 时的 POM 元信息（license 随 LICENSE 文件定为 MIT；scm/developer 已填实际值，
# 需要覆盖时仍可用 -P 传入，例如 -PpomDeveloperEmail=you@example.com）
pomLicenseName=MIT
pomLicenseUrl=https://opensource.org/licenses/MIT
pomScmUrl=https://github.com/huangwenfu750/notifyhub
pomScmConnection=scm:git:https://github.com/huangwenfu750/notifyhub.git
pomScmDevConnection=scm:git:ssh://git@github.com/huangwenfu750/notifyhub.git
pomDeveloperId=huangwenfu750
pomDeveloperName=NotifyHub Authors
pomDeveloperEmail=huangwenfu750@users.noreply.github.com
